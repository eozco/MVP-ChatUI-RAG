version: "3.8"

volumes:
  huggingface-cache:


services:
  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    container_name: lab-vllm
    ports:
      - "8080:8080"
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
    environment:
      HF_HOME: /data/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      NCCL_P2P_DISABLE: "1"
    ipc: host
    volumes:
      - huggingface-cache:/data/huggingface
    command:
      - --model
      - hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
      - --quantization
      - awq
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --served-model-name
      - lab-llama-3.1-8b-awq
      - --dtype
      - auto
      - --max-model-len
      - "8192"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.85"
      - --enforce-eager

  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - vllm

  otel-collector:
    image: otel/opentelemetry-collector:0.106.0
    container_name: lab-otel-collector
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
